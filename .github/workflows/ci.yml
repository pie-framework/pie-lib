# Tests only. This repo no longer publishes to npm: its packages are published from
# pie-framework/pie-elements-ng, which takes over their npm trusted-publisher records
# (PIE-883). npm allows one trusted publisher per package, so once this repo's records are
# revoked, a publish from here would fail with ENEEDAUTH; the publish jobs are removed so a
# merge cannot attempt one. They remain in git history.
name: PIE Lib CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # REQUIRED for lerna version
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install
      - run: scripts/release --build
      - run: scripts/release --test

